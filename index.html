<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gantt di progetto</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#e2e6ee;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--row:32px;--lw:600px;--tw:3000px;--hh:48px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:#b91c1c;border-color:#fecaca}
.btn:disabled{opacity:.4;cursor:default}
.mini{border:1px solid var(--line);background:#fff;border-radius:5px;padding:0 6px;height:22px;cursor:pointer;font-size:12px;white-space:nowrap}
.mini:hover{background:#eef2ff}
.mini-ph{display:inline-block;width:22px;flex:none}
.sp{flex:1}
.err{color:#b91c1c;min-height:18px;font-size:12px}

/* login */
#login{display:none;height:100%;align-items:center;justify-content:center}
#login.on{display:flex}
#login .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;max-width:380px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}
#login h1{margin:0 0 8px;font-size:20px}
#login p{color:var(--muted)}

/* app */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
#banner{display:none;background:#fef3c7;color:#92400e;padding:6px 12px;font-size:12px;border-bottom:1px solid #fde68a}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
#title{font-size:16px;font-weight:700;cursor:pointer;margin-right:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toolbar select,#toolbar input[type=search]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
#toolbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#toolbar label.chk{display:flex;gap:4px;align-items:center;color:var(--muted);cursor:pointer}
#conn{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
#conn.on{background:#16a34a}
#who{color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#scroller{flex:1;overflow:auto;position:relative;background:#fff}
#inner{display:grid;grid-template-columns:var(--lw) var(--tw);grid-template-rows:var(--hh) auto;width:calc(var(--lw) + var(--tw))}
#lefthead{position:sticky;top:0;left:0;z-index:6;background:#eef1f6;border-bottom:1px solid var(--line);border-right:2px solid var(--line);display:flex;align-items:flex-end;padding:0 6px 6px;gap:6px;font-weight:600;color:var(--muted);font-size:12px}
#timehead{position:sticky;top:0;z-index:5;height:var(--hh);background:#eef1f6;border-bottom:1px solid var(--line)}
#leftbody{position:sticky;left:0;z-index:4;background:#fff;border-right:2px solid var(--line)}
#timebody{position:relative;background-image:linear-gradient(to bottom,transparent calc(var(--row) - 1px),var(--line) 0);background-size:100% var(--row)}
.hc{position:absolute;height:24px;border-left:1px solid var(--line);padding:4px 4px 0;font-size:11px;color:#475569;overflow:hidden;white-space:nowrap}
#timehead .top{position:absolute;top:0;left:0;height:24px;width:100%;border-bottom:1px solid var(--line)}
#timehead .bot{position:absolute;top:24px;left:0;height:24px;width:100%}
#timehead .top .hc{font-weight:600}
.hc.we{background:#e5e9f0;color:#94a3b8}

.lrow{height:var(--row);display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:1px solid var(--line);overflow:hidden}
.lrow.sec{background:#e8edf5;font-weight:600}
.lrow.mac{background:#f8fafc}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lrow .nm:hover{color:var(--accent);text-decoration:underline}
.lrow.tsk .ind{width:30px;flex:none}
.lrow .chev{cursor:pointer;width:14px;text-align:center;color:var(--muted);flex:none;user-select:none}
.lrow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.c-res{width:104px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.c-start,.c-end{width:68px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.c-dur{width:40px;flex:none;text-align:right;color:var(--muted)}
.c-st{width:24px;flex:none;text-align:center;cursor:default}
.lrow.tsk .c-st{cursor:pointer}
.compact .c-res,.compact .c-start,.compact .c-end,.compact .c-dur{display:none}

.sb{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1.5px #fff;vertical-align:middle}
.sb svg{width:12px;height:12px}

.wk{position:absolute;inset:0;pointer-events:none}
.secbg{position:absolute;left:0;right:0;background:#eef2f8;pointer-events:none}
.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.today{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;opacity:.65;pointer-events:none;z-index:2}
.bar{position:absolute;z-index:3;height:22px;border-radius:5px;display:flex;align-items:center;gap:4px;padding:0 4px;font-size:12px;cursor:grab;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.25);touch-action:none;white-space:nowrap}
.bar .bl{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;pointer-events:none}
.bar .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar.cancelled{opacity:.5;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px)}
.bar.completed{opacity:.8}
.bar.paused{opacity:.65}
.mbar{position:absolute;z-index:3;height:10px;border-radius:2px;background:var(--c);cursor:pointer}
.mbar::before,.mbar::after{content:"";position:absolute;top:10px;border:5px solid transparent}
.mbar::before{left:0;border-top-color:var(--c);border-left-color:var(--c)}
.mbar::after{right:0;border-top-color:var(--c);border-right-color:var(--c)}
.outl{position:absolute;z-index:3;height:22px;display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;pointer-events:none}

#legend{display:flex;flex-wrap:wrap;gap:12px;padding:6px 12px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#empty{padding:30px 20px;color:var(--muted);line-height:1.7}

dialog{border:0;border-radius:12px;padding:0;width:min(680px,95vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-in{padding:18px 20px;max-height:90vh;overflow:auto}
.dlg-in h3{margin:0 0 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--text);font-size:13px;width:100%}
.foot{display:flex;gap:8px;margin-top:14px;align-items:center}
.picker{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.picker .psearch{border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:12px}
.plist{max-height:130px;overflow:auto;padding:4px}
.plist label{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:5px;color:var(--text);cursor:pointer;font-size:12px}
.plist label:hover{background:#f1f5f9}
.plist label input{width:auto}
.plist small{margin-left:auto;color:var(--muted);white-space:nowrap}
.plist .dot{width:9px;height:9px;border-radius:3px;flex:none}
.plist em{color:var(--muted);padding:4px}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.palette button{width:24px;height:24px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.palette input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px}
.info{background:#f1f5f9;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mrow{display:flex;gap:6px;margin-bottom:6px}
.mrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.menu{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:150px}
.menu button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:#f1f5f9}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;z-index:200;display:none;max-width:90vw}
#toast.bad{background:#b91c1c}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Gantt di progetto</h1>
    <p>Accedi con l’account Google autorizzato dal team.</p>
    <button id="btnLogin" class="btn primary">Accedi con Google</button>
    <p id="loginmsg" class="err"></p>
  </div>
</div>

<div id="app">
  <div id="banner">⚠ Modalità locale: i dati restano solo in questo browser. Configura Firebase (vedi README) per condividere il diagramma con il team in tempo reale.</div>
  <div id="toolbar">
    <span id="title" title="Clic per rinominare">Diagramma di Gantt</span>
    <div class="grp">
      <button class="btn primary" id="btnTask">+ Task</button>
      <button class="btn" id="btnMacro">+ Macrotask</button>
      <button class="btn" id="btnSec">+ Sezione</button>
      <button class="btn" id="btnMembers">Membri</button>
    </div>
    <div class="grp">
      <select id="zoom"></select>
      <button class="btn" id="btnToday">Oggi</button>
      <button class="btn" id="btnCompact" title="Mostra/nascondi colonne della tabella">Tabella</button>
    </div>
    <div class="grp">
      <select id="fRes"></select>
      <select id="fSt"></select>
      <input type="search" id="fQ" placeholder="Cerca task…" size="14">
    </div>
    <div class="grp">
      <label class="chk" title="Se anticipi un task, anche i task che dipendono da lui vengono anticipati (mantenendo lo scarto)"><input type="checkbox" id="pull"> Anticipa anche i successivi</label>
      <button class="btn" id="btnUndo" disabled>↶ Annulla</button>
      <button class="btn" id="btnExport">Esporta</button>
      <button class="btn" id="btnImport">Importa</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <span class="sp"></span>
    <span id="conn" title="Connessione"></span>
    <span id="who"></span>
    <button class="btn" id="btnOut" style="display:none">Esci</button>
  </div>

  <div id="scroller">
    <div id="inner">
      <div id="lefthead">
        <span style="flex:1;padding-left:20px">Task</span>
        <span class="c-res">Responsabile</span><span class="c-start">Inizio</span><span class="c-dur">Durata</span><span class="c-end">Fine</span><span class="c-st"></span><span class="mini-ph"></span>
      </div>
      <div id="timehead"><div class="top" id="htop"></div><div class="bot" id="hbot"></div></div>
      <div id="leftbody"></div>
      <div id="timebody"></div>
    </div>
  </div>
  <div id="legend"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   CONFIGURAZIONE FIREBASE
   Incolla qui i valori del tuo progetto (Impostazioni progetto → Le tue app → Web).
   Se lasci i campi vuoti la pagina funziona in "modalità locale" (solo per prove).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: ""
};

/* ===================== LOGICA PURA (testabile) ===================== */
const DAY = 864e5;
const reISO = /^\d{4}-\d{2}-\d{2}$/;
const toDay = s => { if (!reISO.test(s || '')) return NaN; const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const fromDay = n => new Date(n * DAY).toISOString().slice(0, 10);
const fmt = n => { const d = new Date(n * DAY); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + String(d.getUTCFullYear()).slice(2); };
const todayDay = () => { const n = new Date(); return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY); };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'x' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

const STATUS = {
  notstarted: { label: 'Not started', color: '#94a3b8', p: '<circle cx="8" cy="8" r="3.5"/>' },
  inprogress: { label: 'In progress', color: '#2563eb', p: '<path d="M6 4.5v7l5.5-3.5z" fill="#fff"/>' },
  delayed:    { label: 'Delayed',     color: '#ea580c', p: '<path d="M8 4.5V8l2.5 1.5"/>' },
  atrisk:     { label: 'At risk',     color: '#d97706', p: '<path d="M8 4v5"/><path d="M8 11.6v.1"/>' },
  problem:    { label: 'Problem',     color: '#dc2626', p: '<path d="M5.5 5.5l5 5M10.5 5.5l-5 5"/>' },
  paused:     { label: 'Paused',      color: '#7c3aed', p: '<path d="M6 4.5v7M10 4.5v7"/>' },
  cancelled:  { label: 'Cancelled',   color: '#6b7280', p: '<path d="M4.5 8h7"/>' },
  completed:  { label: 'Completed',   color: '#16a34a', p: '<path d="M4.5 8.3l2.4 2.4 4.6-5"/>' }
};

function deriveStatus(sts) {
  if (!sts.length) return 'notstarted';
  const act = sts.filter(s => s !== 'cancelled');
  if (!act.length) return 'cancelled';
  if (act.every(s => s === 'completed')) return 'completed';
  for (const k of ['problem', 'delayed', 'atrisk']) if (act.includes(k)) return k;
  if (act.every(s => s === 'notstarted')) return 'notstarted';
  if (act.every(s => s === 'paused' || s === 'completed')) return 'paused';
  return 'inprogress';
}

function normalize(raw) {
  const o = clone(raw || {});
  for (const k of ['members', 'sections', 'macros', 'tasks', 'meta']) o[k] = o[k] || {};
  return o;
}

function compute(D) {
  const tasks = [], byId = {};
  for (const [id, t] of Object.entries(D.tasks)) {
    const s = toDay(t.start); if (!isFinite(s)) continue;
    const d = Math.max(1, parseInt(t.dur, 10) || 1);
    const o = { ...t, id, s, d, e: s + d - 1 };
    tasks.push(o); byId[id] = o;
  }
  const preds = {}, succs = {};
  for (const t of tasks) preds[t.id] = Object.keys(t.after || {}).filter(p => byId[p] && p !== t.id);
  for (const t of tasks) for (const p of preds[t.id]) (succs[p] || (succs[p] = [])).push(t.id);
  const indeg = {}; tasks.forEach(t => indeg[t.id] = preds[t.id].length);
  const q = tasks.filter(t => !indeg[t.id]).map(t => t.id), topo = [];
  while (q.length) { const id = q.shift(); topo.push(id); (succs[id] || []).forEach(x => { if (--indeg[x] === 0) q.push(x); }); }
  const cyclic = topo.length < tasks.length;
  if (cyclic) { const seen = new Set(topo); tasks.forEach(t => { if (!seen.has(t.id)) topo.push(t.id); }); }
  const macros = Object.entries(D.macros).map(([id, m]) => ({ ...m, id, tasks: [] })).sort((a, b) => (a.order || 0) - (b.order || 0));
  const macroById = {}; macros.forEach(m => macroById[m.id] = m);
  for (const t of tasks) { const m = macroById[t.macroId]; if (m) m.tasks.push(t); }
  for (const m of macros) { m.tasks.sort((a, b) => a.s - b.s || String(a.name).localeCompare(String(b.name))); m.status = deriveStatus(m.tasks.map(t => t.status)); }
  const sections = Object.entries(D.sections).map(([id, s]) => ({ ...s, id })).sort((a, b) => (a.order || 0) - (b.order || 0));
  return { tasks, byId, preds, succs, topo, cyclic, macros, macroById, sections };
}

/* Riprogramma i task dopo uno spostamento.
   model = modello con i nuovi dati/archi, patches = {id:{s?,d?}}, base = modello PRIMA della modifica.
   Un task non può iniziare prima della fine dei suoi predecessori; i successivi vengono spinti in avanti
   (e, se pullBack, anticipati mantenendo lo scarto). Ritorna {id:{s,d}} per tutti i task. */
function reschedule(model, patches, base, pullBack) {
  const W = {}, old = {};
  for (const t of model.tasks) { W[t.id] = { s: t.s, d: t.d }; old[t.id] = ((base && base.byId[t.id]) || t).e; }
  const patched = new Set(Object.keys(patches).filter(id => W[id]));
  for (const id of patched) Object.assign(W[id], patches[id]);
  const ed = {};
  for (const id of patched) ed[id] = W[id].s + W[id].d - 1 - old[id];
  for (const id of model.topo) {
    const ps = model.preds[id] || []; let req = -Infinity, minD = Infinity;
    for (const p of ps) { req = Math.max(req, W[p].s + W[p].d); const e = ed[p]; if (e) minD = Math.min(minD, e); }
    let s = W[id].s;
    if (patched.has(id)) { if (s < req) s = req; }
    else if (minD !== Infinity) { if (req > s) s = req; else if (minD < 0 && pullBack) s = Math.max(req, s + minD); }
    W[id].s = s;
    const nd = s + W[id].d - 1 - old[id];
    if (nd) ed[id] = nd; else delete ed[id];
  }
  return W;
}

function diff(a, b, path = '', out = {}) {
  const isO = v => v && typeof v === 'object';
  if (isO(a) && isO(b)) {
    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) diff(a[k], b[k], path ? path + '/' + k : k, out);
  } else if (JSON.stringify(a) !== JSON.stringify(b)) {
    out[path] = b === undefined ? null : JSON.parse(JSON.stringify(b));
  }
  return out;
}

function sanitize(d) {
  for (const [id, t] of Object.entries(d.tasks)) {
    if (!d.macros[t.macroId]) { delete d.tasks[id]; continue; }
    if (t.assignee && !d.members[t.assignee]) delete t.assignee;
  }
  for (const [id, t] of Object.entries(d.tasks)) {
    if (t.after) {
      for (const p of Object.keys(t.after)) if (p === id || !d.tasks[p]) delete t.after[p];
      if (!Object.keys(t.after).length) delete t.after;
    }
  }
  for (const m of Object.values(d.macros)) if (m.sectionId && !d.sections[m.sectionId]) delete m.sectionId;
  return d;
}

function prune(o) { for (const k of Object.keys(o)) { const v = o[k]; if (v && typeof v === 'object') { prune(v); if (!Object.keys(v).length) delete o[k]; } } }
function applyPaths(o, u) {
  for (const [p, v] of Object.entries(u)) {
    const ks = p.split('/'); let c = o;
    for (let i = 0; i < ks.length - 1; i++) {
      if (typeof c[ks[i]] !== 'object' || c[ks[i]] === null) { if (v === null) { c = null; break; } c[ks[i]] = {}; }
      c = c[ks[i]];
    }
    if (!c) continue;
    const k = ks[ks.length - 1];
    if (v === null) delete c[k]; else c[k] = clone(v);
  }
  prune(o); return o;
}
/*==PURE-END==*/

/* ===================== STATO E UI ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
const ZOOMS = [{ label: 'Giorni', px: 30 }, { label: 'Settimane', px: 11 }, { label: 'Mesi', px: 3.4 }, { label: 'Trimestri', px: 1.2 }];
const PALETTE = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#64748b', '#84cc16'];
const DEFCOL = '#3b82f6', ROW = 32;

let D = normalize({}), M = compute(D), backend = null, isLocal = false;
let preview = null, drag = null, R0 = 0, R1 = 0, PX = 11, lastR0 = null, lastPx = null, firstScroll = true, ROWS = [];
const undoStack = [];
const loadUI = () => { try { return JSON.parse(localStorage.getItem('gantt-ui-v1')) || {}; } catch { return {}; } };
const UI = Object.assign({ zoom: 1, compact: window.innerWidth < 900, pullBack: true, collapsed: {} }, loadUI());
const saveUI = () => { try { localStorage.setItem('gantt-ui-v1', JSON.stringify(UI)); } catch {} };
const F = { res: '', st: '', q: '' };

const memberName = id => (D.members[id] && D.members[id].name) || '';
const byName = (a, b) => String(a[1].name).localeCompare(String(b[1].name));
const textOn = hex => { const h = String(hex || DEFCOL).replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111827' : '#fff'; };
const badge = k => { const s = STATUS[k] || STATUS.notstarted; return `<span class="sb" style="background:${s.color}" title="${s.label}"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${s.p}</svg></span>`; };

function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', bad ? 5000 : 2600); }

function P(t) { const v = preview && preview[t.id]; const s = v ? v.s : t.s, d = v ? v.d : t.d; return { s, d, e: s + d - 1 }; }
function ext(m) {
  let list = m.tasks.filter(t => t.status !== 'cancelled'); if (!list.length) list = m.tasks; if (!list.length) return null;
  let s = Infinity, e = -Infinity; for (const t of list) { const p = P(t); s = Math.min(s, p.s); e = Math.max(e, p.e); }
  return { s, e, d: e - s + 1 };
}

/* ---------- scrittura dati ---------- */
function commit(D2, label) {
  sanitize(D2);
  const upd = diff(D, D2); if (!Object.keys(upd).length) return false;
  const inv = diff(D2, D);
  undoStack.push({ label, inv }); if (undoStack.length > 50) undoStack.shift(); updUndo();
  Promise.resolve(backend.update(upd)).catch(err => toast('Salvataggio non riuscito: ' + (err.code || err.message), true));
  return true;
}
function updUndo() { const b = $('#btnUndo'); b.disabled = !undoStack.length; b.title = undoStack.length ? 'Annulla: ' + undoStack[undoStack.length - 1].label : ''; }
function undo() { const u = undoStack.pop(); if (!u) return; updUndo(); Promise.resolve(backend.update(u.inv)).catch(e => toast('Annullamento non riuscito: ' + (e.code || e.message), true)); toast('Annullato: ' + u.label); }

function setData(raw) { D = normalize(raw); M = compute(D); refresh(); }

function applyPatches(patches, label) {
  const W = reschedule(M, patches, M, UI.pullBack);
  const D2 = clone(D);
  for (const t of M.tasks) { const w = W[t.id]; if (w.s !== t.s || w.d !== t.d) { D2.tasks[t.id].start = fromDay(w.s); D2.tasks[t.id].dur = w.d; } }
  commit(D2, label);
}
function setStatus(id, k) { const D2 = clone(D); D2.tasks[id].status = k; commit(D2, 'Cambio stato'); }

/* ---------- costruzione righe ---------- */
function buildRows() {
  const rows = [], filtering = !!(F.res || F.st || F.q), q = F.q.toLowerCase();
  const vis = t => (!F.res || t.assignee === F.res) && (!F.st || t.status === F.st) && (!q || (t.name + ' ' + (t.notes || '')).toLowerCase().includes(q));
  const secs = [...M.sections, { id: '', name: 'Senza sezione', virtual: true }];
  for (const sec of secs) {
    const items = [];
    for (const m of M.macros.filter(m => (m.sectionId || '') === sec.id)) { const ts = m.tasks.filter(vis); if (filtering && !ts.length) continue; items.push({ m, ts }); }
    if (!items.length && (sec.virtual || filtering)) continue;
    rows.push({ type: 'sec', sec });
    if (UI.collapsed[sec.id || '_none']) continue;
    for (const { m, ts } of items) { rows.push({ type: 'macro', m }); if (!UI.collapsed[m.id]) ts.forEach(t => rows.push({ type: 'task', t, m })); }
  }
  return rows;
}

function leftHTML(rows) {
  return rows.map(r => {
    if (r.type === 'sec') {
      const k = r.sec.id || '_none', c = UI.collapsed[k];
      return `<div class="lrow sec"><span class="chev" data-act="tog" data-id="${k}">${c ? '▸' : '▾'}</span><span class="nm" ${r.sec.virtual ? '' : `data-act="edit-sec" data-id="${r.sec.id}"`}>${esc(r.sec.name)}</span><button class="mini" data-act="new-macro" data-id="${r.sec.id}">+ Macrotask</button></div>`;
    }
    if (r.type === 'macro') {
      const m = r.m, e = ext(m), c = UI.collapsed[m.id];
      return `<div class="lrow mac"><span class="chev" data-act="tog" data-id="${m.id}">${c ? '▸' : '▾'}</span><i class="sw" style="background:${m.color || DEFCOL}"></i><span class="nm" data-act="edit-macro" data-id="${m.id}" title="${esc(m.name)}"><b>${esc(m.name)}</b></span><span class="c-res">${m.tasks.length} task</span><span class="c-start">${e ? fmt(e.s) : ''}</span><span class="c-dur">${e ? e.d + 'g' : ''}</span><span class="c-end">${e ? fmt(e.e) : ''}</span><span class="c-st">${badge(m.status)}</span><button class="mini" data-act="new-task" data-id="${m.id}" title="Aggiungi task">+</button></div>`;
    }
    const t = r.t, p = P(t);
    return `<div class="lrow tsk"><span class="ind"></span><span class="nm" data-act="edit-task" data-id="${t.id}" title="${esc(t.name)}">${esc(t.name)}</span><span class="c-res">${esc(memberName(t.assignee))}</span><span class="c-start">${fmt(p.s)}</span><span class="c-dur">${p.d}g</span><span class="c-end">${fmt(p.e)}</span><span class="c-st" data-act="status" data-id="${t.id}">${badge(t.status)}</span><span class="mini-ph"></span></div>`;
  }).join('');
}

function headerHTML() {
  const px = PX, cell = (a, b, label, cls = '') => `<div class="hc ${cls}" style="left:${(a - R0) * px}px;width:${(b - a) * px}px">${label}</div>`;
  const ymd = d => { const t = new Date(d * DAY); return [t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), t.getUTCDay()]; };
  const ms = (y, m) => Math.round(Date.UTC(y, m, 1) / DAY);
  let top = '', bot = '';
  for (let d = R0; d <= R1;) { const [y, m] = ymd(d); if (px >= 8) { const n = ms(y, m + 1); top += cell(d, Math.min(n, R1 + 1), MONTHS[m] + ' ' + y); d = n; } else { const n = ms(y + 1, 0); top += cell(d, Math.min(n, R1 + 1), y); d = n; } }
  if (px >= 20) { for (let d = R0; d <= R1; d++) { const [, , dd, dw] = ymd(d); bot += cell(d, d + 1, dd, (dw === 0 || dw === 6) ? 'we' : ''); } }
  else if (px >= 8) { for (let d = R0; d <= R1;) { const [, m, dd, dw] = ymd(d); const n = d + (7 - ((dw + 6) % 7)); bot += cell(d, Math.min(n, R1 + 1), dd + '/' + (m + 1)); d = n; } }
  else if (px >= 3) { for (let d = R0; d <= R1;) { const [y, m] = ymd(d); const n = ms(y, m + 1); bot += cell(d, Math.min(n, R1 + 1), MONTHS[m]); d = n; } }
  else { for (let d = R0; d <= R1;) { const [y, m] = ymd(d); const qn = Math.floor(m / 3); const n = ms(y, qn * 3 + 3); bot += cell(d, Math.min(n, R1 + 1), 'T' + (qn + 1)); d = n; } }
  return [top, bot];
}

function timeHTML(rows) {
  const px = PX, W = (R1 - R0 + 1) * px, H = rows.length * ROW;
  const rowOf = {}; rows.forEach((r, i) => { if (r.type === 'task') rowOf[r.t.id] = i; });
  let bg = '', bars = '', arrows = '';
  rows.forEach((r, i) => {
    const top = i * ROW;
    if (r.type === 'sec') bg += `<div class="secbg" style="top:${top}px;height:${ROW}px"></div>`;
    else if (r.type === 'macro') {
      const e = ext(r.m); if (!e) return;
      const col = r.m.color || DEFCOL, x = (e.s - R0) * px, w = Math.max(e.d * px, 4);
      bars += `<div class="mbar" data-act="edit-macro" data-id="${r.m.id}" style="--c:${col};left:${x}px;width:${w}px;top:${top + 8}px" title="${esc(r.m.name)} · ${fmt(e.s)} → ${fmt(e.e)}"></div><div class="outl" style="left:${x + w + 8}px;top:${top + 5}px">${badge(r.m.status)}<b>${esc(r.m.name)}</b></div>`;
    } else {
      const t = r.t, p = P(t), col = r.m.color || DEFCOL, x = (p.s - R0) * px, w = Math.max(p.d * px, 4), inside = w >= 100;
      const tip = `${t.name}${t.assignee ? ' — ' + memberName(t.assignee) : ''}\n${fmt(p.s)} → ${fmt(p.e)} (${p.d} g) · ${(STATUS[t.status] || STATUS.notstarted).label}`;
      bars += `<div class="bar ${t.status || ''}" data-id="${t.id}" style="left:${x}px;width:${w}px;top:${top + 5}px;background-color:${col};color:${textOn(col)}" title="${esc(tip)}"><i class="h l"></i>${inside ? badge(t.status) + `<span class="bl">${esc(t.name)}</span>` : ''}<i class="h r"></i></div>`;
      if (!inside) bars += `<div class="outl" style="left:${x + w + 6}px;top:${top + 5}px">${badge(t.status)}<span>${esc(t.name)}</span></div>`;
    }
  });
  for (const r of rows) {
    if (r.type !== 'task') continue;
    const pt = P(r.t), y2 = rowOf[r.t.id] * ROW + ROW / 2, x2 = (pt.s - R0) * px;
    for (const pid of (M.preds[r.t.id] || [])) {
      if (rowOf[pid] === undefined) continue;
      const pp = P(M.byId[pid]), y1 = rowOf[pid] * ROW + ROW / 2, x1 = (pp.e + 1 - R0) * px;
      let d;
      if (x2 >= x1 + 12) d = `M${x1} ${y1}H${x1 + 6}V${y2}H${x2 - 1}`;
      else { const my = y1 + (y2 > y1 ? 1 : -1) * ROW / 2; d = `M${x1} ${y1}H${x1 + 6}V${my}H${x2 - 8}V${y2}H${x2 - 1}`; }
      arrows += `<path d="${d}" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>`;
    }
  }
  const dw0 = (new Date(R0 * DAY).getUTCDay() + 6) % 7;
  const wk = px >= 5 ? `background-image:linear-gradient(to right,transparent ${5 * px}px,rgba(15,23,42,.045) ${5 * px}px);background-size:${7 * px}px 100%;background-position:${-dw0 * px}px 0` : '';
  const tx = (todayDay() - R0) * px + px / 2;
  return `<div class="wk" style="${wk}"></div>${bg}<svg class="arrows" width="${W}" height="${H}"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs>${arrows}</svg><div class="today" style="left:${tx}px"></div>${bars}`;
}

function render() {
  const sc = $('#scroller'); PX = ZOOMS[UI.zoom].px;
  let mn = todayDay(), mx = todayDay();
  for (const t of M.tasks) { mn = Math.min(mn, t.s); mx = Math.max(mx, t.e); }
  const d0 = new Date((mn - 21) * DAY); R0 = Math.round(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1) / DAY);
  R1 = Math.max(mx + 150, R0 + 365);
  const anchor = lastR0 == null ? null : lastR0 + sc.scrollLeft / lastPx;
  const rows = ROWS = buildRows();
  const root = document.documentElement.style;
  root.setProperty('--lw', (UI.compact ? 290 : 600) + 'px');
  root.setProperty('--tw', ((R1 - R0 + 1) * PX) + 'px');
  document.body.classList.toggle('compact', UI.compact);
  const [top, bot] = headerHTML(); $('#htop').innerHTML = top; $('#hbot').innerHTML = bot;
  const lb = $('#leftbody'), tb = $('#timebody');
  if (!rows.length) {
    const filtering = F.res || F.st || F.q;
    lb.innerHTML = filtering ? '<div id="empty">Nessun task corrisponde ai filtri.</div>'
      : '<div id="empty"><b>Il progetto è vuoto.</b><br>Crea una sezione e un macrotask, poi aggiungi i task.<br><button class="btn primary" data-act="new-macro" data-id="">Crea il primo macrotask</button> <button class="btn" data-act="sample">Carica dati di esempio</button></div>';
    tb.innerHTML = ''; tb.style.height = '0px';
  } else { lb.innerHTML = leftHTML(rows); tb.innerHTML = timeHTML(rows); tb.style.height = rows.length * ROW + 'px'; }
  tb.style.width = (R1 - R0 + 1) * PX + 'px';
  if (anchor != null) sc.scrollLeft = (anchor - R0) * PX;
  if (firstScroll) { firstScroll = false; sc.scrollLeft = Math.max(0, (todayDay() - R0) * PX - 120); }
  lastR0 = R0; lastPx = PX;
}

function fillFilters() {
  const r = $('#fRes'), cur = r.value;
  r.innerHTML = '<option value="">Tutti i responsabili</option>' + Object.entries(D.members).sort(byName).map(([id, m]) => `<option value="${id}">${esc(m.name)}</option>`).join('');
  r.value = cur; if (r.value !== cur) F.res = r.value = '';
}
function refresh() {
  fillFilters(); render();
  const t = D.meta.title || 'Diagramma di Gantt'; $('#title').textContent = t; document.title = t;
}

/* ---------- finestre di dialogo ---------- */
const dlg = $('#dlg');
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openDlg(html) { dlg.innerHTML = `<div class="dlg-in">${html}</div>`; if (!dlg.open) dlg.showModal(); }
const checked = n => [...dlg.querySelectorAll(`.picker[data-p="${n}"] input[type=checkbox]:checked`)].map(i => i.value);

function picker(name, list, set) {
  return `<div class="picker" data-p="${name}"><input class="psearch" placeholder="Cerca task…"><div class="plist">${list.map(x => `<label data-q="${esc((x.mname + ' ' + x.name).toLowerCase())}"><input type="checkbox" value="${x.id}" ${set.has(x.id) ? 'checked' : ''}><i class="dot" style="background:${x.color}"></i><span>${esc(x.mname)} › ${esc(x.name)}</span><small>${fmt(x.s)}–${fmt(x.e)}</small></label>`).join('') || '<em>Nessun altro task</em>'}</div></div>`;
}
function wirePickers() {
  dlg.querySelectorAll('.picker').forEach(p => p.querySelector('.psearch').addEventListener('input', e => { const q = e.target.value.toLowerCase(); p.querySelectorAll('label').forEach(l => l.style.display = l.dataset.q.includes(q) ? '' : 'none'); }));
}

function openTask(id, preset = {}) {
  if (!M.macros.length) { toast('Crea prima almeno un macrotask.', true); return; }
  const isNew = !id, mac = preset.macroId || (M.macros[0] && M.macros[0].id);
  const t = id ? M.byId[id] : { name: '', macroId: mac, assignee: '', s: todayDay(), d: 5, e: todayDay() + 4, status: 'notstarted', notes: '' };
  if (!t) return;
  const others = M.tasks.filter(x => x.id !== id).map(x => { const m = M.macroById[x.macroId] || {}; return { ...x, mname: m.name || '', color: m.color || DEFCOL, mo: m.order || 0 }; }).sort((a, b) => a.mo - b.mo || a.s - b.s);
  const pset = new Set(id ? M.preds[id] : []), sset = new Set(id ? (M.succs[id] || []) : []);
  openDlg(`<h3>${isNew ? 'Nuovo task' : 'Modifica task'}</h3><div class="grid2">
    <label class="f full">Nome<input id="f_name" value="${esc(t.name)}" autofocus></label>
    <label class="f">Macrotask<select id="f_macro">${M.macros.map(m => `<option value="${m.id}" ${m.id === t.macroId ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
    <label class="f">Responsabile<select id="f_res"><option value="">—</option>${Object.entries(D.members).sort(byName).map(([k, m]) => `<option value="${k}" ${k === t.assignee ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
    <label class="f">Inizio<input type="date" id="f_start" value="${fromDay(t.s)}"></label>
    <label class="f">Durata (giorni)<input type="number" min="1" id="f_dur" value="${t.d}"></label>
    <label class="f">Scadenza (ultimo giorno)<input type="date" id="f_end" value="${fromDay(t.e)}"></label>
    <label class="f">Stato<select id="f_st">${Object.entries(STATUS).map(([k, s]) => `<option value="${k}" ${k === (t.status || 'notstarted') ? 'selected' : ''}>${s.label}</option>`).join('')}</select></label>
    <div class="f full">Inizia dopo… (il task parte il giorno successivo alla fine di quelli scelti)${picker('pred', others, pset)}</div>
    <div class="f full">Deve finire prima di… (i task scelti verranno spostati automaticamente)${picker('succ', others, sset)}</div>
    <label class="f full">Note<textarea id="f_notes" rows="2">${esc(t.notes || '')}</textarea></label></div>
    <div class="err" id="f_err"></div>
    <div class="foot">${isNew ? '' : '<button class="btn danger" data-a="del">Elimina</button>'}<span class="sp"></span><button class="btn" data-a="cancel">Annulla</button><button class="btn primary" data-a="save">Salva</button></div>`);
  wirePickers();
  const g = s => $(s, dlg);
  const syncEnd = () => { const s = toDay(g('#f_start').value), d = parseInt(g('#f_dur').value, 10); if (isFinite(s) && d >= 1) g('#f_end').value = fromDay(s + d - 1); };
  g('#f_start').oninput = syncEnd; g('#f_dur').oninput = syncEnd;
  g('#f_end').onchange = () => { const s = toDay(g('#f_start').value), e = toDay(g('#f_end').value); if (!isFinite(s) || !isFinite(e)) return; if (e < s) g('#f_end').value = fromDay(s); g('#f_dur').value = Math.max(1, e - s + 1); };
  dlg.onclick = ev => {
    const a = ev.target.closest('[data-a]'); if (!a) { if (ev.target === dlg) dlg.close(); return; }
    if (a.dataset.a === 'cancel') dlg.close();
    if (a.dataset.a === 'del' && confirm('Eliminare questo task?')) { const D2 = clone(D); delete D2.tasks[id]; commit(D2, 'Elimina task'); dlg.close(); }
    if (a.dataset.a === 'save') saveTask(id);
  };
}

function saveTask(id) {
  const g = s => $(s, dlg), err = m => { g('#f_err').textContent = m; };
  const name = g('#f_name').value.trim(), macroId = g('#f_macro').value, s = toDay(g('#f_start').value), d = parseInt(g('#f_dur').value, 10);
  if (!name) return err('Inserisci il nome del task.');
  if (!macroId) return err('Scegli un macrotask.');
  if (!isFinite(s)) return err('Data di inizio non valida.');
  if (!(d >= 1)) return err('La durata deve essere di almeno 1 giorno.');
  const preds = checked('pred'), succs = checked('succ');
  if (preds.some(x => succs.includes(x))) return err('Un task non può essere sia predecessore sia successore.');
  const tid = id || uid(), D2 = clone(D), nt = { ...(D2.tasks[tid] || {}), name, macroId, start: fromDay(s), dur: d, status: g('#f_st').value };
  const asg = g('#f_res').value; if (asg) nt.assignee = asg; else delete nt.assignee;
  const nts = g('#f_notes').value.trim(); if (nts) nt.notes = nts; else delete nt.notes;
  nt.after = Object.fromEntries(preds.map(p => [p, true]));
  D2.tasks[tid] = nt;
  const touched = new Set();
  for (const [oid, o] of Object.entries(D2.tasks)) {
    if (oid === tid) continue;
    const has = !!(o.after && o.after[tid]), want = succs.includes(oid);
    if (want && !has) { o.after = { ...(o.after || {}), [tid]: true }; touched.add(oid); }
    else if (!want && has) delete o.after[tid];
  }
  const M2 = compute(D2);
  if (M2.cyclic) return err('Le dipendenze scelte creano un ciclo.');
  const patches = { [tid]: { s, d } }; touched.forEach(x => { patches[x] = patches[x] || {}; });
  const W = reschedule(M2, patches, M, UI.pullBack);
  for (const t of M2.tasks) { const w = W[t.id]; if (w.s !== t.s || w.d !== t.d) { D2.tasks[t.id].start = fromDay(w.s); D2.tasks[t.id].dur = w.d; } }
  if (W[tid].s !== s) toast('Inizio spostato al ' + fmt(W[tid].s) + ' per rispettare i vincoli.');
  commit(D2, id ? 'Modifica task' : 'Nuovo task'); dlg.close();
}

function openMacro(id, preset = {}) {
  const m = id ? M.macroById[id] : { name: '', color: PALETTE[M.macros.length % PALETTE.length], sectionId: preset.sectionId || '', notes: '', tasks: [], status: 'notstarted' };
  if (!m) return; const e = id ? ext(m) : null;
  openDlg(`<h3>${id ? 'Modifica macrotask' : 'Nuovo macrotask'}</h3><div class="grid2">
    <label class="f full">Nome<input id="f_name" value="${esc(m.name)}" autofocus></label>
    <label class="f">Sezione<select id="f_sec"><option value="">— nessuna —</option>${M.sections.map(s => `<option value="${s.id}" ${s.id === (m.sectionId || '') ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <div class="f">Colore<div class="palette">${PALETTE.map(c => `<button type="button" data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="f_col" value="${m.color || DEFCOL}"></div></div>
    <label class="f full">Note<textarea id="f_notes" rows="2">${esc(m.notes || '')}</textarea></label></div>
    ${id ? `<div class="info" style="margin-top:10px">${badge(m.status)} <span>${(STATUS[m.status] || {}).label} (derivato dai task)</span><span>${e ? 'Inizio ' + fmt(e.s) + ' · Fine ' + fmt(e.e) + ' (data dell’ultimo task)' : 'Nessun task'}</span></div>` : ''}
    <div class="err" id="f_err"></div>
    <div class="foot">${id ? '<button class="btn danger" data-a="del">Elimina</button>' : ''}<span class="sp"></span><button class="btn" data-a="cancel">Annulla</button><button class="btn primary" data-a="save">Salva</button></div>`);
  dlg.onclick = ev => {
    const c = ev.target.closest('[data-c]'); if (c) { $('#f_col', dlg).value = c.dataset.c; return; }
    const a = ev.target.closest('[data-a]'); if (!a) { if (ev.target === dlg) dlg.close(); return; }
    if (a.dataset.a === 'cancel') dlg.close();
    if (a.dataset.a === 'del') { if (confirm(`Eliminare il macrotask${m.tasks.length ? ' e i suoi ' + m.tasks.length + ' task' : ''}?`)) { const D2 = clone(D); delete D2.macros[id]; commit(D2, 'Elimina macrotask'); dlg.close(); } }
    if (a.dataset.a === 'save') {
      const name = $('#f_name', dlg).value.trim(); if (!name) { $('#f_err', dlg).textContent = 'Inserisci il nome.'; return; }
      const D2 = clone(D), mid = id || uid(), nm = { ...(D2.macros[mid] || {}), name, color: $('#f_col', dlg).value, order: (D2.macros[mid] && D2.macros[mid].order) || Date.now() };
      const sec = $('#f_sec', dlg).value; if (sec) nm.sectionId = sec; else delete nm.sectionId;
      const nts = $('#f_notes', dlg).value.trim(); if (nts) nm.notes = nts; else delete nm.notes;
      D2.macros[mid] = nm; commit(D2, id ? 'Modifica macrotask' : 'Nuovo macrotask'); dlg.close();
    }
  };
}

function openSection(id) {
  const s = id ? D.sections[id] : { name: '' };
  openDlg(`<h3>${id ? 'Modifica sezione' : 'Nuova sezione'}</h3><label class="f">Nome<input id="f_name" value="${esc(s.name)}" autofocus></label>
    <div class="err" id="f_err"></div><div class="foot">${id ? '<button class="btn danger" data-a="del">Elimina</button>' : ''}<span class="sp"></span><button class="btn" data-a="cancel">Annulla</button><button class="btn primary" data-a="save">Salva</button></div>`);
  dlg.onclick = ev => {
    const a = ev.target.closest('[data-a]'); if (!a) { if (ev.target === dlg) dlg.close(); return; }
    if (a.dataset.a === 'cancel') dlg.close();
    if (a.dataset.a === 'del' && confirm('Eliminare la sezione? I suoi macrotask resteranno “senza sezione”.')) { const D2 = clone(D); delete D2.sections[id]; commit(D2, 'Elimina sezione'); dlg.close(); }
    if (a.dataset.a === 'save') {
      const name = $('#f_name', dlg).value.trim(); if (!name) { $('#f_err', dlg).textContent = 'Inserisci il nome.'; return; }
      const D2 = clone(D), sid = id || uid(); D2.sections[sid] = { ...(D2.sections[sid] || {}), name, order: (D2.sections[sid] && D2.sections[sid].order) || Date.now() };
      commit(D2, id ? 'Modifica sezione' : 'Nuova sezione'); dlg.close();
    }
  };
}

function openMembers() {
  const row = (id, name) => `<div class="mrow" data-id="${id}"><input value="${esc(name)}" placeholder="Nome e cognome"><button class="btn danger" data-a="rm" title="Rimuovi">✕</button></div>`;
  openDlg(`<h3>Membri del team</h3><div id="mlist">${Object.entries(D.members).sort(byName).map(([id, m]) => row(id, m.name)).join('')}</div>
    <button class="btn" data-a="add">+ Aggiungi membro</button><p style="color:var(--muted);font-size:12px">Rimuovendo un membro, i suoi task restano senza responsabile. Questo elenco serve per assegnare i task: l’accesso alla pagina si gestisce da Firebase (vedi README).</p>
    <div class="foot"><span class="sp"></span><button class="btn" data-a="cancel">Annulla</button><button class="btn primary" data-a="save">Salva</button></div>`);
  dlg.onclick = ev => {
    const a = ev.target.closest('[data-a]'); if (!a) { if (ev.target === dlg) dlg.close(); return; }
    if (a.dataset.a === 'cancel') dlg.close();
    if (a.dataset.a === 'rm') a.closest('.mrow').remove();
    if (a.dataset.a === 'add') { $('#mlist', dlg).insertAdjacentHTML('beforeend', row('', '')); $('#mlist .mrow:last-child input', dlg).focus(); }
    if (a.dataset.a === 'save') {
      const D2 = clone(D); D2.members = {};
      dlg.querySelectorAll('.mrow').forEach(r => { const n = r.querySelector('input').value.trim(); if (n) D2.members[r.dataset.id || uid()] = { name: n }; });
      commit(D2, 'Modifica membri'); dlg.close();
    }
  };
}

/* ---------- menu stato ---------- */
function closeMenu() { document.querySelectorAll('.menu').forEach(m => m.remove()); }
function statusMenu(el, id) {
  closeMenu(); const r = el.getBoundingClientRect(), m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = Object.entries(STATUS).map(([k, s]) => `<button data-k="${k}">${badge(k)} ${s.label}</button>`).join('');
  document.body.appendChild(m);
  m.style.left = Math.min(r.left, innerWidth - 170) + 'px'; m.style.top = Math.min(r.bottom + 2, innerHeight - m.offsetHeight - 8) + 'px';
  m.onclick = e => { const b = e.target.closest('button'); if (b) { setStatus(id, b.dataset.k); closeMenu(); } };
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
}

/* ---------- dati di esempio ---------- */
function loadSample() {
  const b = todayDay() - 14, D2 = clone(D), now = Date.now();
  const m = ['Anna Rossi', 'Luca Bianchi', 'Marta Verdi', 'Paolo Neri'].map(n => { const id = uid(); D2.members[id] = { name: n }; return id; });
  const s1 = uid(), s2 = uid(); D2.sections[s1] = { name: 'Fase 1 – Progettazione', order: now }; D2.sections[s2] = { name: 'Fase 2 – Realizzazione', order: now + 1 };
  const A = uid(), B = uid(); D2.macros[A] = { name: 'Studio di fattibilità', color: '#3b82f6', sectionId: s1, order: now }; D2.macros[B] = { name: 'Realizzazione', color: '#10b981', sectionId: s2, order: now + 1 };
  const t = [uid(), uid(), uid(), uid(), uid()];
  const mk = (i, name, mac, off, dur, st, who, after) => { D2.tasks[t[i]] = { name, macroId: mac, start: fromDay(b + off), dur, status: st, assignee: m[who] }; if (after !== undefined) D2.tasks[t[i]].after = { [t[after]]: true }; };
  mk(0, 'Analisi requisiti', A, 0, 10, 'completed', 0);
  mk(1, 'Progetto preliminare', A, 10, 15, 'inprogress', 1, 0);
  mk(2, 'Revisione del progetto', A, 25, 5, 'atrisk', 2, 1);
  mk(3, 'Approvvigionamenti', B, 30, 20, 'notstarted', 3, 2);
  mk(4, 'Costruzione', B, 50, 40, 'notstarted', 1, 3);
  commit(D2, 'Dati di esempio');
}

/* ---------- eventi ---------- */
function act(name, id, el) {
  switch (name) {
    case 'tog': UI.collapsed[id] = !UI.collapsed[id]; saveUI(); render(); break;
    case 'edit-task': openTask(id); break;
    case 'edit-macro': openMacro(id); break;
    case 'edit-sec': openSection(id); break;
    case 'new-task': openTask(null, { macroId: id }); break;
    case 'new-macro': openMacro(null, { sectionId: id }); break;
    case 'status': statusMenu(el, id); break;
    case 'sample': loadSample(); break;
  }
}
$('#leftbody').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act, a.dataset.id, a); });
$('#timebody').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act, a.dataset.id, a); });

$('#timebody').addEventListener('pointerdown', e => {
  const bar = e.target.closest('.bar'); if (!bar || e.button !== 0) return;
  const t = M.byId[bar.dataset.id]; if (!t) return;
  drag = { id: t.id, mode: e.target.classList.contains('l') ? 'rl' : e.target.classList.contains('r') ? 'rr' : 'mv', x0: e.clientX, moved: false, delta: null, s: t.s, d: t.d };
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x0;
  if (!drag.moved && Math.abs(dx) < 4) return;
  drag.moved = true; const delta = Math.round(dx / PX); if (delta === drag.delta) return; drag.delta = delta;
  let patch;
  if (drag.mode === 'mv') patch = { s: drag.s + delta, d: drag.d };
  else if (drag.mode === 'rr') patch = { s: drag.s, d: Math.max(1, drag.d + delta) };
  else {
    const end = drag.s + drag.d - 1; let ns = Math.min(drag.s + delta, end);
    let req = -Infinity; for (const p of (M.preds[drag.id] || [])) req = Math.max(req, M.byId[p].e + 1);
    ns = Math.min(Math.max(ns, req), end); patch = { s: ns, d: end - ns + 1 };
  }
  drag.patch = patch; preview = reschedule(M, { [drag.id]: patch }, M, UI.pullBack);
  cancelAnimationFrame(drag.raf); drag.raf = requestAnimationFrame(render);
});
window.addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null; cancelAnimationFrame(d.raf);
  if (!d.moved) { openTask(d.id); return; }
  preview = null;
  if (d.patch) applyPatches({ [d.id]: d.patch }, 'Sposta task'); else render();
  render();
});
window.addEventListener('pointercancel', () => { if (drag) { drag = null; preview = null; render(); } });

$('#btnTask').onclick = () => openTask(null);
$('#btnMacro').onclick = () => openMacro(null);
$('#btnSec').onclick = () => openSection(null);
$('#btnMembers').onclick = openMembers;
$('#btnUndo').onclick = undo;
$('#btnToday').onclick = () => { $('#scroller').scrollTo({ left: Math.max(0, (todayDay() - R0) * PX - 120), behavior: 'smooth' }); };
$('#btnCompact').onclick = () => { UI.compact = !UI.compact; saveUI(); render(); };
$('#zoom').innerHTML = ZOOMS.map((z, i) => `<option value="${i}">Scala: ${z.label}</option>`).join('');
$('#zoom').value = UI.zoom; $('#zoom').onchange = e => { UI.zoom = +e.target.value; saveUI(); render(); };
$('#pull').checked = UI.pullBack; $('#pull').onchange = e => { UI.pullBack = e.target.checked; saveUI(); };
$('#fSt').innerHTML = '<option value="">Tutti gli stati</option>' + Object.entries(STATUS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join('');
$('#fRes').onchange = e => { F.res = e.target.value; render(); };
$('#fSt').onchange = e => { F.st = e.target.value; render(); };
$('#fQ').oninput = e => { F.q = e.target.value.trim(); render(); };
$('#legend').innerHTML = Object.entries(STATUS).map(([k, s]) => `<span>${badge(k)} ${s.label}</span>`).join('') + '<span style="margin-left:auto">Trascina le barre per spostarle, i bordi per cambiare la durata. Lo stato dei macrotask è derivato dai task.</span>';
$('#title').onclick = () => { const n = prompt('Titolo del progetto:', D.meta.title || ''); if (n !== null && n.trim()) { const D2 = clone(D); D2.meta.title = n.trim(); commit(D2, 'Titolo'); } };
$('#btnExport').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' })); a.download = 'gantt-backup-' + fromDay(todayDay()) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('#btnImport').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const o = JSON.parse(await f.text()); if (!o || typeof o !== 'object' || !o.tasks) throw new Error('formato non valido'); if (!confirm('Sostituire TUTTI i dati attuali con quelli del file?')) return; commit(normalize(o), 'Importazione'); toast('Importazione completata.'); }
  catch (err) { toast('File non valido: ' + err.message, true); }
};
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !dlg.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); }
  if (e.key === 'Escape') closeMenu();
});

/* ---------- avvio: Firebase o modalità locale ---------- */
const showLogin = msg => { if (msg !== undefined) $('#loginmsg').textContent = msg; $('#app').classList.remove('on'); $('#login').classList.add('on'); };
const showApp = who => { $('#login').classList.remove('on'); $('#app').classList.add('on'); $('#who').textContent = who || ''; refresh(); };

async function startFirebase() {
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, Au, Db] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-database.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG), auth = Au.getAuth(app), db = Db.getDatabase(app);
  let unsub = null;
  backend = { update: u => Db.update(Db.ref(db), u) };
  $('#btnLogin').onclick = async () => { $('#loginmsg').textContent = ''; try { await Au.signInWithPopup(auth, new Au.GoogleAuthProvider()); } catch (e) { showLogin('Accesso non riuscito: ' + (e.code || e.message)); } };
  $('#btnOut').style.display = ''; $('#btnOut').onclick = () => Au.signOut(auth);
  Au.onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { showLogin(); return; }
    showApp(user.displayName || user.email);
    unsub = Db.onValue(Db.ref(db), snap => setData(snap.val()), () => { showLogin('Accesso negato: l’account ' + user.email + ' non è autorizzato. Chiedi all’amministratore di aggiungerlo.'); Au.signOut(auth); });
  });
  Db.onValue(Db.ref(db, '.info/connected'), s => $('#conn').classList.toggle('on', !!s.val()));
}

function startLocal() {
  isLocal = true; const KEY = 'gantt-local-v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  let store = load();
  backend = { update: async u => { applyPaths(store, u); localStorage.setItem(KEY, JSON.stringify(store)); setData(store); } };
  window.addEventListener('storage', e => { if (e.key === KEY) { store = load(); setData(store); } });
  $('#banner').style.display = 'block'; $('#conn').classList.add('on');
  showApp('Locale'); setData(store);
}

if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL) startFirebase().catch(e => showLogin('Impossibile caricare Firebase: ' + e.message));
else startLocal();
</script>
